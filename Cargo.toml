[workspace]
resolver = "3"
members = ["busperf_web", "libbusperf", "busperf_gui"]

[package]
name = "busperf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Bus performance analysis tool"
repository = "https://github.com/antmicro/busperf"

[dependencies]
csv = "1.3.1"
pyo3 = { version = "0.25.1", default-features = false, features = ["auto-initialize", "macros"], optional = true }
tabled = { version = "0.20.0", default-features = false, features = ["std"] }
wellen = "0.24.0"
yaml-rust2 = "0.10.3"
libbusperf = { path = "libbusperf", version = "0.1.0", features = ["file-hash"] }
busperf_gui = { path = "busperf_gui", version = "0.1.0", features = ["surfer"], optional = true}
bpaf = { version = "0.9.20", features = ["autocomplete"] }
flate2 = "1.1.4"
constcat = "0.6.1"
owo-colors = "4.2.3"
cfg-if = "1.0.4"
bitcode = "0.6.9"
blake3 = "1.8.2"
busperf_web = { path = "busperf_web", version = "0.1.0", optional = true, features = ["build_wasm"] }
hashbrown = "0.16.1"
itertools = "0.14.0"

[features]
default = ["help-colors", "gui", "python-plugins", "generate-html"]
help-colors = ["bpaf/bright-color"]
python-plugins = ["dep:pyo3"]
gui = ["dep:busperf_gui"]
generate-html = ["dep:busperf_web"]

