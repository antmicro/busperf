common_clk_rst_ifs:
  common: &common_clk
    clock: "clk"
    reset: "rst"
    reset_type: "high"

"interfaces":
  "ram_rd":
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk

    custom_analyzer: "AXIRdAnalyzer"
    ar:
      id: ["s_axi_rd", "arid"]
      ready: ["s_axi_rd", "arready"]
      valid: ["s_axi_rd", "arvalid"]
    r:
      id: ["s_axi_rd", "rid"]
      ready: ["s_axi_rd", "rready"]
      valid: ["s_axi_rd", "rvalid"]
      resp: ["s_axi_rd", "rresp"]
      last: ["s_axi_rd", "rlast"]

    activate_on: "control_only.fsm.activate"
    deactivate_on:
      - "control_only.fsm.deactivate"
      - "control_only.fsm.end"

"control_only":
  "time_range":
    type: timer
    triggers:
      data: [1, 10, 14, 16, 19, 150000, 320000, 600000, 700000, 800000]
      timeout: [15]
      trigger: [12, 16, 160000, 320000, 600000, 700000, 800000]
      block: [1, 17, 20, 210000, 340000, 650000, 700000]
      unblock: [18, 21, 210001, 600000, 660000, 750000]
      end: [800000]
      

  "fsm":
    type: fsm
    states:
      "idle":
        transition_to:
          "data": ["control_only.time_range.data"]
          "block": ["control_only.time_range.block"]
      "data":
        transition_to:
          "end": ["control_only.time_range.end"]
          "trigg": ["control_only.time_range.trigger"]
          "block": ["control_only.time_range.block"]
          "idle": ["control_only.time_range.timeout"]
      "block":
        trigger_set: "deactivate"
        transition_to:
          "idle": ["control_only.time_range.unblock"]
      "trigg":
        trigger_set: "activate"
        transition_to:
          "idle": []
      "end":
        trigger_set: "end"
