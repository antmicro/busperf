common_clk_rst_ifs:
  common: &common_clk
    clock: "clk"
    reset: "rst"
    reset_type: "high"

"interfaces":
  "ram_rd":
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk

    custom_analyzer: "AXIRdAnalyzer"
    ar:
      id: ["s_axi_rd", "arid"]
      ready: ["s_axi_rd", "arready"]
      valid: ["s_axi_rd", "arvalid"]
    r:
      id: ["s_axi_rd", "rid"]
      ready: ["s_axi_rd", "rready"]
      valid: ["s_axi_rd", "rvalid"]
      resp: ["s_axi_rd", "rresp"]
      last: ["s_axi_rd", "rlast"]

    activate_on:
      - "interfaces.ram_raddr.addr_set"
    deactivate_on:
      - "interfaces.ram_r.last"
    
  ram_raddr:
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk
    handshake: ReadyValid
    ready: [s_axi_rd, arready]
    valid: [s_axi_rd, arvalid]
    addr: [s_axi_rd, araddr]
    
    triggers:
      "addr_set": 
        - all:
          - state: busy
          - signal: addr
            range: [7:0]
            value: [0x4]
            
  ram_r:
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk
    handshake: ReadyValid
    ready: [s_axi_rd, rready]
    valid: [s_axi_rd, rvalid]
    rlast: [s_axi_rd, rlast]
    
    triggers:
      "last": 
        - all:
          - state: busy
          - signal: rlast
            value: 1

  "ram_wr":
    scope: ["test_taxi_axi_ram", "uut"]
    clock: "clk"
    reset: "rst"
    reset_type: "high"

    custom_analyzer: "AXIWrAnalyzer"
    aw:
      id: ["s_axi_rd", "awid"]
      ready: ["s_axi_wr", "awready"]
      valid: ["s_axi_wr", "awvalid"]
    w:
      ready: ["s_axi_wr", "wready"]
      valid: ["s_axi_wr", "wvalid"]
      last: ["s_axi_wr", "wlast"]
    b:
      ready: ["s_axi_wr", "bready"]
      valid: ["s_axi_wr", "bvalid"]
      resp: ["s_axi_wr", "bresp"]
      id: ["s_axi_rd", "bid"]
      
    activate_on:
      - "interfaces.ram_waddr.addr_set"
    deactivate_on:
      - "interfaces.ram_b.response"

  ram_waddr:
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk
    handshake: ReadyValid
    ready: [s_axi_wr, awready]
    valid: [s_axi_wr, awvalid]
    addr: [s_axi_wr, awaddr]
    
    triggers:
      "addr_set": 
        - all:
          - state: busy
          - signal: addr
            range: [7:0]
            value: [0x07]
            
  ram_b:
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk
    handshake: ReadyValid
    ready: [s_axi_wr, bready]
    valid: [s_axi_wr, bvalid]
    
    triggers:
      "response": 
        - all:
          - state: busy
