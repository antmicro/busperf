common_clk_rst_ifs:
  common: &common_clk
    clock: "clk"
    reset: "rst"
    reset_type: "high"

"interfaces":
  "ram_rd":
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk

    custom_analyzer: "AXIFullRdAnalyzerPython"
    ar:
      id: ["s_axi_rd", "arid"]
      ready: ["s_axi_rd", "arready"]
      valid: ["s_axi_rd", "arvalid"]
    r:
      id: ["s_axi_rd", "rid"]
      ready: ["s_axi_rd", "rready"]
      valid: ["s_axi_rd", "rvalid"]
      resp: ["s_axi_rd", "rresp"]
      last: ["s_axi_rd", "rlast"]

    activate_on:
      - "interfaces.ram_raddr.addr_set"
    deactivate_on:
      - "interfaces.ram_r.last"

    triggers:
      trigg:
        - signal: ar.id
          range: [7:0]
          value: [0x0] 

    
  ram_raddr:
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk
    handshake: Custom
    custom_handshake: PythonReadyValid
    ready: [s_axi_rd, arready]
    valid: [s_axi_rd, arvalid]
    addr: [s_axi_rd, araddr]
    
    triggers:
      "addr_set": 
        - all:
          - state: busy
          - signal: addr
            range: [7:0]
            value: [0x4]
            
  ram_r:
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk
    handshake: Custom
    custom_handshake: PythonReadyValid
    ready: [s_axi_rd, rready]
    valid: [s_axi_rd, rvalid]
    rlast: [s_axi_rd, rlast]
    
    triggers:
      "last": 
        - all:
          - state: busy
          - signal: rlast
            value: 1

  stub:
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk
    handshake: ReadyValid
    ready: [s_axi_rd, rready]
    valid: [s_axi_rd, rvalid]

    activate_on:
      - interfaces.ram_rd.trigg
