common_clk_rst_ifs:
  common: &common_clk
    clock: "clk"
    reset: "rst"
    reset_type: "high"

"interfaces":
  "ram_rd":
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk

    custom_analyzer: "AXIRdAnalyzer"
    ar:
      id: ["s_axi_rd", "arid"]
      ready: ["s_axi_rd", "arready"]
      valid: ["s_axi_rd", "arvalid"]
    r:
      id: ["s_axi_rd", "rid"]
      ready: ["s_axi_rd", "rready"]
      valid: ["s_axi_rd", "rvalid"]
      resp: ["s_axi_rd", "rresp"]
      last: ["s_axi_rd", "rlast"]
    
    activate_on:
      - "control_only.fsm.name"

    deactivate_on:
     - "control_only.time_range.start"

    triggers:
      ar:
        name:
          - all:
            - state: busy
            - signal: id
              range: [7:0]
              value: [0x0]
      r:  
        name:
          - all:
            - state: busy
            - signal: id
              range: [7:0]
              value: [0x0]
      _:  
        "_start": "name"
        "_end": "name2"

  ram_raddr:
    scope: [test_taxi_axi_ram, uut]
    clk_rst_if: *common_clk
    handshake: ReadyValid
    ready: [s_axi_rd, arready]
    valid: [s_axi_rd, arvalid]
    addr: [s_axi_rd, araddr]
    
    triggers:
      "addr_set":
        - all:
          - state: busy
          - signal: addr
            range: [7:0]
            value: [0x4]

"control_only":
  "time_range":
    type: timer
    triggers:
      start: [1000000, 1000000000, 2885020000]
      stop:  [900000000, 2500000000]

  "fsm":
    type: fsm
    states:
      "idle":
        transition_to:
          "data": ["interfaces.ram_raddr.addr_set"]
      "data":
        transition_to:
          "trigg": ["control_only.time_range.stop"]
          "idle": ["control_only.time_range.start"]
      "trigg":
        trigger_set: "name"
        transition_to:
          "idle": []
